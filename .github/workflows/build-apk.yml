name: Build Snap Growth APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter project
        run: |
          unzip -o snap_growth_github_builder.zip -d project

      - name: Update Android build versions
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#' project/android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/com.android.application.*version "8.3.2"/com.android.application version "8.11.1"/' project/android/settings.gradle
          sed -i "s/com.android.tools.build:gradle:8.3.2/com.android.tools.build:gradle:8.11.1/" project/android/build.gradle
          cat project/android/gradle/wrapper/gradle-wrapper.properties
          cat project/android/settings.gradle

      - name: Get Flutter dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snap-growth-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
