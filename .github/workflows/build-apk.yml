name: Build Snap Growth APK

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project ZIP
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Extract project ZIP
    run: |
      unzip -o snap_growth_github_builder.zip -d project
      cd project
      if [ -f pubspec.yaml ]; then
        echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV
      else
        find . -name pubspec.yaml -print
        exit 1
      fi

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      flutter pub get
      flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: snap-growth-apk
      path: project/build/app/outputs/flutter-apk/app-release.apk
